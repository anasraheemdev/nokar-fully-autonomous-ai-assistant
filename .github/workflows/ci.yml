name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Validate (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libegl1 libgl1-mesa-glx libxkbcommon-x11-0 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Compilation Validation
      run: |
        python -m compileall -q actions core memory tests main.py ui.py setup.py

    - name: Run Headless Core Test Suite
      run: |
        python tests/test_ci_headless.py

    - name: Run UI and Feature Verification Suite (Windows)
      if: runner.os == 'Windows'
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        python tests/test_ui_features.py
